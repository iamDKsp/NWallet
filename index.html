    <script>
      // Native touch & gesture stabilization for iOS & Android
      (function () {
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
          document.addEventListener(
            type,
            function (e) {
              e.preventDefault();
            },
            { passive: false }
          );
        });

        var lastTouchEnd = 0;
        document.addEventListener(
          'touchend',
          function (e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 300) {
              e.preventDefault();
            }
            lastTouchEnd = now;
          },
          { passive: false }
        );
      })();
    </script>
