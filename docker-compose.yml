version: '3.8'

services:
  nwallet:
    build:
      context: .
      dockerfile: Dockerfile
    image: iamdksp/nwallet:latest
    container_name: nwallet-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 5173) + '/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); })\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
